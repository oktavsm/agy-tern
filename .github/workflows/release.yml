name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(bun -e 'import pkg from "./package.json"; console.log(pkg.version)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Warning: git tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build production bundle
        run: bun run build

      - name: Package release archive & checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG_DIR="agy-tern-${VERSION}"
          mkdir -p "release-out/${PKG_DIR}/scripts"
          cp -r dist src assets package.json bun.lock tsconfig.json README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md "release-out/${PKG_DIR}/"
          cp scripts/install.sh "release-out/${PKG_DIR}/scripts/"
          (cd release-out && tar -czf "agy-tern-${VERSION}.tar.gz" "${PKG_DIR}")
          (cd release-out && sha256sum "agy-tern-${VERSION}.tar.gz" > SHA256SUMS.txt)

      - name: Smoke test release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release-smoke
          tar -xzf "release-out/agy-tern-${VERSION}.tar.gz" -C release-smoke
          (cd "release-smoke/agy-tern-${VERSION}" && bun run dist/cli.js --help >/dev/null && bun run dist/cli.js --version && bun install --frozen-lockfile && bun run build && bun run dist/cli.js --help >/dev/null)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-out/agy-tern-*.tar.gz
            release-out/SHA256SUMS.txt
